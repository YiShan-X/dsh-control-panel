name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast path: the core is dependency-free, so the suite runs without ever
  # downloading Electron. Matrix covers the platforms whose code paths actually
  # differ (junctions vs symlinks, cmd /c shim wrapping).
  test:
    name: test · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install (skip Electron's binary download)
        run: npm ci --ignore-scripts
      - name: Run the test suite
        run: npm test

  # Slow path: prove the actual desktop window boots on each platform. This is
  # the only job that pays for the Electron download.
  desktop:
    name: desktop smoke · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Smoke test (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run smoke
      - name: Smoke test
        if: runner.os != 'Linux'
        run: npm run smoke

  # Packaging is the part most likely to break silently, so build the real
  # installers on every PR without publishing them.
  package:
    name: package · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: ubuntu-latest
            args: --linux --x64
          - os: macos-latest
            args: --mac --x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ runner.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
